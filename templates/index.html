<html>
    <head>
    </head>
    <style>
        .grid{
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
        }
        .cartao{
            position: relative;
            display:flex;
            aling-items: center;
            gap: 30px;
            border: 1px solid gray;
            border-radius: 5px;
            padding: 5px;
            font-family: 'Segoe UI';
            color: rgb(164, 79, 190)

        }
        h2{
            position: absolute;
            top: 0px;
            right: 0px;
            margin: 0px;
            color: gray;

        }
    </style>
    <body>
        <div class="grid">
        {% for item in numeros %}
        <div class="cartao">
          <img src={{imagens[loop.index0]}}>
           <h2>#{{numeros[loop.index0]}}</h2>
          <h1>{{nomes[loop.index0]}}</h1>
        </div>
        {%  endfor %}
        </div>
    </body>
</html>
